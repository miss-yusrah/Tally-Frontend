<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tabr — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0714;
        color: #f8f8ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 320px; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #5921b5 0%, #2563eb 100%);
        display: grid; place-items: center;
        font-size: 30px;
      }
      h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.6; color: #a9a5b2; margin-bottom: 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        padding: 12px 28px; border-radius: 999px;
        background: linear-gradient(135deg, #5921b5 0%, #2563eb 100%);
        color: #fff; font-size: 15px; font-weight: 600;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⚡</div>
      <h1>You're offline</h1>
      <p>Tabr needs a connection to load this screen. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
